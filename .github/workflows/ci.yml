name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: slashevents
          POSTGRES_PASSWORD: slashevents
          POSTGRES_DB: slashevents_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U slashevents -d slashevents_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: postgres://slashevents:slashevents@localhost:5432/slashevents_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun test ./src
      - run: docker build -t slashevents:ci .
      - name: Container smoke test
        run: |
          docker run -d --name slashevents-smoke --network host \
            -e DATABASE_URL="$TEST_DB_URL" \
            -e SLASHEVENTS_API_TOKEN=ci-test-token-at-least-32-characters \
            -e RETENTION_INTERVAL_SECONDS=1 \
            slashevents:ci
          SLASHEVENTS_API_TOKEN=ci-test-token-at-least-32-characters bun run test:smoke
          docker restart slashevents-smoke
          SLASHEVENTS_API_TOKEN=ci-test-token-at-least-32-characters bun run test:smoke -- --verify
          docker stop --time 15 slashevents-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' slashevents-smoke)" = 0
      - name: Container logs
        if: failure()
        run: docker logs slashevents-smoke
